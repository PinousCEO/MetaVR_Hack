<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nilo Market</title>
<!--
  The shop on the PC: a real marketplace, where people sell what they made to each other under their nicknames.
  One self-contained page. It asks only this host for anything (its font, its sticker art, the state of the shop
  once a second, and the commands it posts); the host talks to the marketplace hub in the user's name, so their
  token never reaches a browser. The look is the partner's picture-book world: cream paper, dark-brown ink outlines,
  pastel badges, soft paper shadows.
-->
<style>
@font-face { font-family: "Jua"; src: url("/market/font/Jua-Regular.ttf") format("truetype"); font-display: swap; }
:root {
  --paper: #FFF8EA; --card: #FFFDF6; --ink: #4A2F27; --soft: #86695C; --faint: rgba(74,47,39,.12);
  --sage: #A8DDB5; --honey: #FFD466; --sky: #8FD3F4; --rose: #F8B4C8; --lav: #C7B8F5; --coral: #FF9B85; --tan: #F1CE96;
  --head: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --body: "Pretendard", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  background-color: var(--paper);
  background-image: radial-gradient(rgba(74,47,39,.055) 1.2px, transparent 1.3px), radial-gradient(900px 500px at 8% -10%, #FFEFC4 0, transparent 70%), radial-gradient(800px 480px at 100% 0, #FCE0E8 0, transparent 70%);
  background-size: 22px 22px, auto, auto; background-attachment: fixed;
  word-break: keep-all; overflow-wrap: anywhere;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--head); font-weight: 400; margin: 0; letter-spacing: .01em; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
[hidden] { display: none !important; }

/* ---------------------------------------------------------------- header */
header { position: sticky; top: 0; z-index: 20; background: rgba(255,248,234,.92); backdrop-filter: blur(8px); border-bottom: 2.5px solid var(--ink); }
header .wrap { display: flex; align-items: center; gap: 14px; height: 76px; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; flex: none; }
.mark img { height: 36px; width: 112px; object-fit: cover; display: block; }      /* (the word mark sits in the middle of a wide strip) */
.mark span { font: 28px/1 var(--head); padding: 5px 14px 3px; border-radius: 999px; background: var(--honey); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); transform: rotate(-2deg); }
.search { flex: 1; min-width: 160px; margin-left: 10px; position: relative; }
.search input { width: 100%; height: 44px; padding: 0 18px 0 44px; border-radius: 999px; border: 2.5px solid var(--ink); background: #fff; outline: none; transition: box-shadow .15s; }
.search input:focus { box-shadow: 0 0 0 4px rgba(143,211,244,.6); }
.search svg { position: absolute; left: 15px; top: 12px; width: 20px; height: 20px; }
.seg { display: flex; border: 2.5px solid var(--ink); border-radius: 999px; overflow: hidden; background: #fff; flex: none; }
.seg button { border: 0; background: none; padding: 0 13px; height: 39px; font: 15px/1 var(--head); color: var(--soft); white-space: nowrap; }
.seg button + button { border-left: 2px solid var(--faint); }
.seg button.on { background: var(--ink); color: var(--paper); }
/* who the user is in the shop: a round face with the first letter of the nickname, the nickname, the stars */
.me { display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 6px 0 5px; border-radius: 999px; background: #fff; border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); flex: none; max-width: 300px; transition: transform .08s, box-shadow .08s; }
.me:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.me:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.me .nick { font: 17px/1 var(--head); padding-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.me .stars { display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 11px 0 6px; border-radius: 999px; background: #FFF1BF; border: 2px solid var(--ink); flex: none; }
.me .stars img { width: 22px; height: 22px; }
.me .stars b { font: 19px/1 var(--head); font-weight: 400; min-width: 2ch; text-align: right; padding-top: 2px; }
.me .stars.bump { animation: bump .5s; }
@keyframes bump { 30% { transform: scale(1.14) rotate(-3deg); } 60% { transform: scale(.97); } }
.av { --s: 34px; width: var(--s); height: var(--s); border-radius: 50%; border: 2px solid var(--ink); background: var(--c, var(--honey)); display: inline-grid; place-items: center; font: calc(var(--s) * .52)/1 var(--head); padding-top: calc(var(--s) * .06); flex: none; position: relative; text-transform: uppercase; }
.av.dot::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink); background: var(--sage); }
.av.dot.off::after { background: #D9CFC7; }
.official { width: 15px; height: 15px; flex: none; }

/* ---------------------------------------------------------------- banners: no nickname yet, the shop cannot be reached */
.banner { display: flex; align-items: center; gap: 16px; margin: 22px 0 0; padding: 14px 18px; border-radius: 22px; border: 2.5px solid var(--ink); background: #fff; box-shadow: 0 5px 0 rgba(74,47,39,.16); }
.banner h3 { font-size: 21px; line-height: 1.2; }
.banner p { margin: 2px 0 0; font-size: 13.5px; color: var(--soft); }
.banner .grow { flex: 1; min-width: 0; }
.banner.name { background: linear-gradient(100deg, #E9F6FD, #F1ECFF); }
.banner.name .av { --s: 52px; border-width: 2.5px; box-shadow: 0 3px 0 rgba(74,47,39,.2); }
.banner form { display: flex; gap: 8px; flex: none; }
.field { height: 44px; padding: 0 16px; border-radius: 999px; border: 2.5px solid var(--ink); background: #fff; outline: none; font-size: 16px; width: 210px; }
.field:focus { box-shadow: 0 0 0 4px rgba(143,211,244,.6); }
.banner.off { background: #FFE9E2; }
.banner.off svg { width: 46px; height: 46px; flex: none; }

/* ---------------------------------------------------------------- the strip: new things are asked of Nilo, not made on this page */
.ask { margin: 24px 0 8px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 26px; align-items: center; padding: 18px 26px; border-radius: 30px; border: 3px solid var(--ink);
  background: linear-gradient(120deg, #FFE7A6 0%, #FFDCC6 52%, #F9CADB 100%); box-shadow: 0 6px 0 rgba(74,47,39,.9); position: relative; overflow: hidden; }
.ask::before { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -120px; border-radius: 50%; background: rgba(255,255,255,.35); pointer-events: none; }
.askside { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; min-width: 0; }
.askside .hint { font: 13.5px/1.4 var(--body); color: #6A4A3E; }
/* talking to Nilo by typing: this is where new things are asked for */
.talkbox { display: flex; gap: 8px; scroll-margin-top: 96px; }
.talkbox input { flex: 1; min-width: 0; height: 48px; padding: 0 20px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; font-size: 16px; outline: none; box-shadow: inset 0 3px 0 rgba(74,47,39,.07); }
.talkbox input:focus { box-shadow: inset 0 3px 0 rgba(74,47,39,.07), 0 0 0 4px rgba(255,255,255,.75); }
.talkbox .btn { height: 48px; padding: 0 20px; font-size: 17px; border-width: 3px; }
.tries { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px dashed var(--ink); border-radius: 999px; background: rgba(255,255,255,.7); padding: 3px 11px 2px; font: 13px/1.4 var(--body); }
button.chip:hover { background: #fff; }
.talkcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.mine { align-self: flex-end; max-width: 88%; background: var(--honey); border: 2.5px solid var(--ink); border-radius: 18px 18px 5px 18px; padding: 7px 14px 6px; font-size: 14.5px; line-height: 1.4; box-shadow: 0 3px 0 rgba(74,47,39,.2); overflow-wrap: anywhere; }
.mine[hidden] { display: none; }
.bubble .line .dots { vertical-align: middle; }
.btn { border: 2.5px solid var(--ink); border-radius: 999px; background: #fff; font: 16px/1 var(--head); padding: 9px 16px 7px; box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s, filter .15s; white-space: nowrap; text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { filter: brightness(1.04); transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.go { background: var(--coral); }
.btn.sun { background: var(--honey); }
.btn.mint { background: var(--sage); }
.btn.big { font-size: 20px; padding: 0 26px; height: 56px; border-width: 3px; }
.btn.quiet { box-shadow: none; border-width: 2px; padding: 7px 13px 5px; font-size: 14.5px; background: transparent; }
.btn.quiet:hover { background: #fff; transform: none; box-shadow: none; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn[disabled] { cursor: default; filter: grayscale(.5) opacity(.6); transform: none; box-shadow: 0 3px 0 var(--ink); }
.btn.wait { color: transparent; position: relative; pointer-events: none; }
.btn.wait > * { visibility: hidden; }
.btn.wait::after { content: ""; position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ink); border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.says { display: flex; align-items: flex-end; gap: 12px; position: relative; z-index: 1; }
.avatar { width: 76px; height: 76px; flex: none; filter: drop-shadow(0 4px 0 rgba(74,47,39,.25)); animation: bob 3.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-2deg); } }
.bubble { flex: 1; min-width: 0; background: #fff; border: 3px solid var(--ink); border-radius: 24px 24px 24px 6px; padding: 12px 18px; min-height: 64px; box-shadow: 0 5px 0 rgba(74,47,39,.2); display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.bubble .who { font: 13px/1 var(--head); color: var(--soft); }
.bubble .line { font-size: 15px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.progress { display: none; align-items: center; gap: 10px; font: 15px/1.3 var(--head); color: #6A4A3E; background: rgba(255,255,255,.65); border: 2px solid var(--ink); border-radius: 999px; padding: 7px 14px 6px; }
.progress.on { display: flex; }
.progress #making { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress .bar { flex: none; width: 96px; height: 10px; border-radius: 999px; border: 2px solid var(--ink); background: #fff; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--coral); transition: width 1s linear; }
.progress .bar[hidden] { display: none; }
/* "I made it - shall I put it up?": the same question the partner asks in the room, as a small card */
.offer { display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 10px 14px; box-shadow: 0 4px 0 rgba(74,47,39,.25); }
.offer[hidden] { display: none; }
.offer .badge { width: 54px; height: 54px; flex: none; margin: 0; }
.offer .what { flex: 1; min-width: 0; }
.offer .what b { display: block; font: 17px/1.2 var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.offer .what span { font-size: 13.5px; color: #6A4A3E; }
.offer .acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); border: 1.5px solid var(--ink); animation: hop .9s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; background: var(--honey); } .dots i:nth-child(3) { animation-delay: .3s; background: var(--sage); }
@keyframes hop { 30% { transform: translateY(-6px); } 60% { transform: none; } }

/* ---------------------------------------------------------------- tabs */
.tabs { position: sticky; top: 78px; z-index: 15; display: flex; gap: 8px; padding: 18px 0 12px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(var(--paper) 78%, transparent); }
.tab { border: 2.5px solid var(--ink); border-radius: 999px; background: var(--card); padding: 8px 16px 6px; font: 17px/1 var(--head); display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: transform .1s; }
.tab:hover { transform: translateY(-2px); }
.tab i { font-style: normal; font: 12px/1 var(--body); font-weight: 700; padding: 3px 7px; border-radius: 999px; background: var(--faint); }
.tab.on { background: var(--ink); color: var(--paper); box-shadow: 0 3px 0 rgba(74,47,39,.35); }
.tab.on i { background: rgba(255,248,234,.22); }
.tab .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); }
.tab.on .dot { border-color: var(--paper); }
.tab.shop { margin-left: auto; background: #FFE9E2; }
.tab.shop.on { background: var(--ink); }
.tab.shop svg { width: 18px; height: 18px; }
.tab.shop.on svg { stroke: var(--paper); }
.filter { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px 4px; font-size: 14px; color: var(--soft); }
.filter .who { display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 6px 3px 4px; background: #fff; color: var(--ink); font: 15px/1 var(--head); }
.filter .who .av { --s: 24px; border-width: 1.5px; }
.filter .who button { border: 0; background: var(--faint); width: 22px; height: 22px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
.filter .who button svg { width: 9px; height: 9px; }

/* ---------------------------------------------------------------- shelf */
.section { margin: 10px 0 34px; }
.section > h2 { font-size: 26px; display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px 4px; }
.section > h2 small { font: 14px/1 var(--body); color: var(--soft); }
.section > h2::after { content: ""; flex: 1; height: 0; border-top: 2.5px dashed rgba(74,47,39,.25); transform: translateY(-5px); }
.section.people { padding: 20px 22px 24px; margin: 6px -22px 30px; border-radius: 30px; background: rgba(255,255,255,.55); border: 2.5px dashed rgba(74,47,39,.3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 22px; }
.card { position: relative; display: flex; flex-direction: column; background: var(--card); border: 2.5px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 rgba(74,47,39,.16), 0 14px 24px -14px rgba(74,47,39,.35);
  overflow: hidden; cursor: pointer; transition: transform .16s cubic-bezier(.3,1.4,.5,1), box-shadow .16s; text-align: left; padding: 0; }
.card:hover { transform: translateY(-6px) rotate(-.4deg); box-shadow: 0 12px 0 rgba(74,47,39,.14), 0 26px 30px -16px rgba(74,47,39,.45); }
.card:focus-visible, .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .me:focus-visible, .row:focus-visible { outline: 4px solid rgba(143,211,244,.9); outline-offset: 2px; }
.card .top { height: 92px; background: var(--tint); border-bottom: 2.5px solid var(--ink); position: relative; }
.card .top::after { content: ""; position: absolute; inset: 0; background: radial-gradient(rgba(255,255,255,.55) 2px, transparent 2.4px) 0 0 / 18px 18px; opacity: .7; }
.card > .badge { position: absolute; left: 18px; top: 34px; z-index: 1; }
.card .body { padding: 46px 18px 16px; display: flex; flex-direction: column; flex: 1; }
.card h3 { font-size: 21px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.by { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--soft); margin-top: 5px; min-width: 0; }
.by .av { --s: 20px; border-width: 1.5px; }
.by span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .gives { margin: 10px 0 14px; font-size: 14px; line-height: 1.45; color: #5C4036; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
.card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.price { display: inline-flex; align-items: center; gap: 5px; font: 17px/1 var(--head); padding: 6px 12px 4px 8px; border-radius: 999px; background: #FFF1BF; border: 2px solid var(--ink); white-space: nowrap; }
.price img { width: 20px; height: 20px; margin-top: -2px; }
.price.free { background: #DDF3E2; padding-left: 12px; }
.price.have { background: #fff; padding-left: 12px; color: var(--soft); }
.price.mine { background: #E4DBFB; }
.price.gone { background: #F4E9E4; color: var(--soft); padding-left: 12px; }
.stats { display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--soft); font-weight: 600; }
.stats span { display: inline-flex; align-items: center; gap: 3px; }
.stats svg { width: 14px; height: 14px; }
.kindtag { position: absolute; left: 12px; top: 9px; z-index: 1; font: 12.5px/1 var(--head); padding: 5px 10px 3px; border-radius: 999px; background: rgba(255,255,255,.85); border: 2px solid var(--ink); }
.ribbon { position: absolute; z-index: 2; right: -44px; top: 20px; width: 168px; text-align: center; transform: rotate(36deg); background: var(--sage); border-block: 2.5px solid var(--ink); font: 14.5px/1 var(--head); padding: 7px 0 5px; box-shadow: 0 3px 0 rgba(74,47,39,.18); }
.ribbon.mine { background: var(--lav); }
.card.pop { animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.94); } 45% { transform: scale(1.05) rotate(-1deg); } }
.card.in { animation: rise .45s cubic-bezier(.2,1.2,.4,1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } }

/* the round sticker a module is shown by: a cream edge, an ink ring, a pastel face, a little gloss */
.badge { --s: 96px; width: var(--s); height: var(--s); border-radius: 50%; background: #FFF6E1; box-shadow: 0 0 0 1.5px rgba(74,47,39,.14), 0 5px 0 rgba(74,47,39,.2); display: grid; place-items: center; flex: none; }
.badge .face { width: 82%; height: 82%; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 34% 26%, #fff 0, var(--b1) 40%, var(--b2) 100%); position: relative; overflow: hidden; display: grid; place-items: center; }
.badge .face::after { content: ""; position: absolute; left: 14%; top: 9%; width: 38%; height: 20%; border-radius: 50%; background: rgba(255,255,255,.6); transform: rotate(-24deg); pointer-events: none; }
.badge .face img { width: 86%; height: 86%; object-fit: contain; }
.badge .face svg { width: 70%; height: 70%; overflow: visible; }
.badge.tile { background: none; box-shadow: none; }
.badge.tile img { width: 126%; height: 126%; margin: -13%; display: block; filter: drop-shadow(0 4px 0 rgba(74,47,39,.14)); }      /* (the baked stickers carry a margin of their own) */
.k-item { --tint: #FBE6BD; --b1: #FFF0CF; --b2: #F1CE96; } .k-skill { --tint: #E4DBFB; --b1: #EFE9FF; --b2: #C7B8F5; }
.k-game { --tint: #FBD3DD; --b1: #FFE4EA; --b2: #F8B4C8; } .k-ambience { --tint: #CDEBFA; --b1: #E5F5FD; --b2: #8FD3F4; }
.k-ability { --tint: #D2EED8; --b1: #E8F7EB; --b2: #A8DDB5; }

.empty { border: 2.5px dashed rgba(74,47,39,.35); border-radius: 24px; padding: 40px 24px 44px; text-align: center; color: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.empty img { width: 92px; height: 92px; opacity: .9; filter: drop-shadow(0 4px 0 rgba(74,47,39,.14)); }
.empty h3 { font-size: 22px; color: var(--ink); margin: 6px 0 2px; }
.empty p { margin: 0; max-width: 46ch; }
footer { padding: 10px 0 46px; color: var(--soft); font-size: 13px; text-align: center; }

/* ---------------------------------------------------------------- my shop: what I sell, what I could sell */
.mystats { display: grid; grid-template-columns: repeat(3, minmax(120px, 170px)) 1fr; gap: 16px; margin: 4px 0 30px; }
.stat { border: 2.5px solid var(--ink); border-radius: 22px; background: var(--card); padding: 16px 18px 12px; box-shadow: 0 5px 0 rgba(74,47,39,.14); }
.stat b { display: flex; align-items: center; gap: 6px; font: 34px/1 var(--head); font-weight: 400; }
.stat b img { width: 30px; height: 30px; margin-top: -4px; }
.stat span { font-size: 13px; color: var(--soft); }
.stat.star { background: #FFF6D6; }
.drop { border: 2.5px dashed var(--ink); border-radius: 22px; background: rgba(255,255,255,.6); padding: 12px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background .15s, transform .1s; }
.drop:hover, .drop.over { background: #fff; transform: translateY(-2px); }
.drop svg { width: 40px; height: 40px; flex: none; }
.drop b { display: block; font: 19px/1.2 var(--head); font-weight: 400; }
.drop span { font-size: 13px; color: var(--soft); }
.rows { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 16px; padding: 12px 16px 12px 14px; border: 2.5px solid var(--ink); border-radius: 22px; background: var(--card); box-shadow: 0 4px 0 rgba(74,47,39,.13); cursor: pointer; }
.row .badge { --s: 64px; box-shadow: 0 0 0 1.5px rgba(74,47,39,.14), 0 3px 0 rgba(74,47,39,.18); }
.row .badge .face { border-width: 2.5px; }
.row .what { flex: 1; min-width: 0; }
.row h3 { font-size: 20px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 13px; color: var(--soft); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.row .sub b { font-weight: 600; color: var(--ink); }

/** The round sticker of a module: its own picture when it has one; otherwise one by what it is. */
function badge(m) {
  const d = m.detail || {};
  if (m.icon) return `<div class="badge"><div class="face"><img src="${esc(WORLD + m.icon)}" alt="" loading="lazy"></div></div>`;
  const known = BY_ID[m.id];
  if (known && known.startsWith("art:")) return tile(known.slice(4));
  if (known) return face(glyph(known));
  if (m.kind === "game") return TILES[m.template] ? tile(TILES[m.template]) : face(glyph("ghost"));
  if (m.kind === "skill") return tile("skill-any.png");
  if (m.kind === "ambience") return face(glyph(G[d.pattern] ? d.pattern : "none"));
  if (m.kind === "ability") return face(glyph("ability"));
  return d.shape && d.shape !== "box" && G[d.shape] ? face(glyph(d.shape)) : tile("item-any.png");
}
// a picture that cannot be fetched (the file is gone) gives way to a plain drawing rather than a broken frame
document.addEventListener("error", e => { const f = e.target.tagName === "IMG" && e.target.closest(".face"); if (f) f.innerHTML = glyph("none"); }, true);
const tile = file => `<div class="badge tile"><img src="${ART}${file}" alt="" loading="lazy"></div>`;
const face = inner => `<div class="badge"><div class="face">${inner}</div></div>`;

/** Somebody's face in the shop: a round patch in a colour that belongs to their name, with its first letter. */
const FACES = ["#FFD466", "#8FD3F4", "#F8B4C8", "#C7B8F5", "#FF9B85", "#A8DDB5", "#F1CE96"];
function av(name, cls) {
  name = String(name || "?").trim() || "?";
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return `<span class="av${cls ? " " + cls : ""}" style="--c:${FACES[h % FACES.length]}">${esc([...name][0])}</span>`;
}
const starImg = () => `<img src="${ART}star.png" alt="">`;

let openId = (PREVIEW && PREVIEW.open) || "", confirmId = PREVIEW && PREVIEW.confirm ? openId : "", profileOpen = !!(PREVIEW && PREVIEW.profile);
let typed = (PREVIEW && PREVIEW.typed) || "", typedAt = 0, typedSaidAt = -1;      // what the user last typed to Nilo, when, and what Nilo's last line was then (until a newer one comes it is thinking)
let drawn = "", drawnDrawer = "", drawnProfile = "", drawnOffer = "", waiting = new Set(), seen = null, seenRevision = -1, toastTimer = 0, playing = "", lastNotice = "", shownStars = null, firstDraw = true, hostUp = true;
const drafts = {};                                                  // prices being set in "my shop", by id, until they are saved
const L = () => T[lang || (state && state.korean === false ? "en" : "ko")];
const isKo = () => L() === T.ko;
/** A listing's words in the page's language (what came with the partner has Korean lines of its own). */
const nameOf = m => (isKo() && m.alias) || m.name;
const givesOf = m => (isKo() && m.koGives) || m.gives;
const sumOf = m => (isKo() && m.koSummary) || m.summary;
const sellerOf = m => m.seller || "?";
// A kind goes into class names: only the five kinds there are ever do (a listing comes from a hub, and a hub is somebody else's server).
const KINDS = ["item", "skill", "game", "ambience", "ability"];
const kindOf = m => KINDS.includes(m.kind) ? m.kind : "item";
// A colour goes into a style attribute: only #RRGGBB ever does.
const colour = c => /^#[0-9a-fA-F]{6}$/.test(c || "") ? c : "#FFF8EA";
const hangul = s => /[가-힣]/.test(s || "");
/** What the partner gains, as the drawer's headline. A seller writes that line in their own language: on a Korean page an English one gives way to the seller's own description. */
const headline = m => { const g = givesOf(m); return !g || (isKo() && !hangul(g) && hangul(sumOf(m))) ? "" : g; };

function chrome() {
  const t = L();
  document.documentElement.lang = isKo() ? "ko" : "en";
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
  $("q").placeholder = t.search; $("name-in").placeholder = t.namePh;
  $("askhint").textContent = t.askHint;
  $("talktext").placeholder = t.talkPh; $("talkbtn").textContent = t.talkSend;
  $("tries").innerHTML = t.tries.map(x => `<button type="button" class="chip" data-try="${esc(x)}">${esc(x)}</button>`).join("");
  $("lang-ko").classList.toggle("on", isKo()); $("lang-en").classList.toggle("on", !isKo());
  $("sort").innerHTML = ["popular", "new", "price"].map(s => `<button type="button" class="${sort === s ? "on" : ""}" data-sort="${s}">${esc(t.sorts[s])}</button>`).join("");
}
document.querySelectorAll("[data-art]").forEach(e => { e.src = ART + e.dataset.art; });

// ------------------------------------------------------------------ the shop
function matches(m) {
  if (seller && sellerOf(m) !== seller) return false;
  if (!query) return true;
  const d = m.detail || {};
  const hay = [m.name, m.summary, m.gives, m.seller, m.kind, m.alias, m.koGives, m.koSummary, d.song, d.howTo, d.enemyName, d.pickupName, ...(d.tags || []), ...(d.phrases || [])].join(" ").toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
const ORDER = {
  popular: (a, b) => b.installs - a.installs || b.likes - a.likes || b.created - a.created,
  new: (a, b) => b.created - a.created || b.installs - a.installs,
  price: (a, b) => a.price - b.price || b.installs - a.installs,
};

/** What a thing costs - or that it is the user's already. */
function priceTag(m, t) {
  if (m.mine) return m.listed ? `<span class="price mine">${starImg()}${m.price || esc(t.free)}</span>` : `<span class="price have">${esc(t.yours)}</span>`;
  if (m.owned) return `<span class="price have">${esc(t.have)}</span>`;
  if (!m.listed) return `<span class="price gone">${esc(t.gone)}</span>`;
  if (!m.price) return `<span class="price free">${esc(t.free)}</span>`;
  return `<span class="price">${starImg()}${m.price}</span>`;
}
const who = (m, t) => `${av(sellerOf(m))}<span>${esc(sellerOf(m))}</span>${m.official ? ICON.check : ""}`;

function card(m, t, i, showKind) {
  const tag = showKind ? t.kinds[m.kind] : m.kind === "game" && m.template === "survival" ? t.templates.survival : "";
  return `<article class="card k-${kindOf(m)}${firstDraw ? " in" : ""}" style="animation-delay:${Math.min(i, 14) * 28}ms" data-id="${esc(m.id)}" tabindex="0" role="button">
    ${m.mine ? `<div class="ribbon mine">${esc(t.yours)}</div>` : m.installed ? `<div class="ribbon">${esc(t.installed)}</div>` : ""}
    <div class="top">${tag ? `<span class="kindtag">${esc(tag)}</span>` : ""}</div>${badge(m)}
    <div class="body">
      <h3>${esc(nameOf(m))}</h3>
      <div class="by">${who(m, t)}</div>
      <p class="gives">${esc(m.official ? givesOf(m) || sumOf(m) : sumOf(m) || givesOf(m))}</p>
      <div class="foot">${priceTag(m, t)}<span class="stats"><span title="${esc(t.got(m.installs))}">${ICON.got}${m.installs}</span><span title="${esc(t.likes)}">${ICON.heart}${m.likes}</span></span></div>
    </div>
  </article>`;
}

/** One line of "my shop": something of the user's own, with what it has earned and the price it is (or could be) sold at. */
function row(m, t) {
  const price = drafts[m.id] != null ? drafts[m.id] : m.listed ? m.price : 10;
  const wait = waiting.has(m.id) ? " wait" : "";
  const stepper = `<div class="stepper" data-stop><button type="button" data-step="-5" data-id="${esc(m.id)}" aria-label="-5">−</button><label>${starImg()}<input type="number" min="0" max="999" value="${price}" data-price="${esc(m.id)}" aria-label="${esc(t.cPrice)}"></label><button type="button" data-step="5" data-id="${esc(m.id)}" aria-label="+5">+</button></div>`;
  const sub = m.listed
    ? (m.sold > 0 ? `<b>${esc(t.sold(m.sold))}</b><span>${esc(t.earned(m.earned))}</span>` : `<span>${esc(t.notSold)}</span>`) + `<span class="stats"><span>${ICON.heart}${m.likes}</span></span>`
    : `<span>${esc(sumOf(m) || givesOf(m) || "")}</span>`;
  return `<div class="row k-${kindOf(m)}${m.listed ? "" : " unsold"}" data-id="${esc(m.id)}" tabindex="0" role="button">
    ${badge(m)}
    <div class="what"><h3>${esc(nameOf(m))}</h3><div class="sub"><span class="tag">${esc(t.kinds[m.kind])}</span>${!m.installed ? `<span class="tag" style="background:#fff">${esc(t.away)}</span>` : ""}${sub}</div></div>
    <div class="acts" data-stop>
      ${stepper}
      ${m.listed ? `<button class="btn sun${wait}" data-do="setPrice" data-id="${esc(m.id)}" ${price === m.price ? "hidden" : ""}>${esc(t.savePrice)}</button><button class="btn${wait}" data-do="unpublish" data-id="${esc(m.id)}">${esc(t.stopSell)}</button>`
                 : `<button class="btn go${wait}" data-do="publish" data-id="${esc(m.id)}">${esc(t.start)}</button>`}
      <a class="btn quiet" href="/market/export/${encodeURIComponent(m.id)}.yonder" download title="${esc(t.exportB)} (.yonder)">${ICON.out}${esc(t.exportB)}</a>
    </div>
  </div>`;
}

function render() {
  if (!state) return;
  const t = L();
  const list = state.list || [];
  const onSale = list.filter(m => m.listed), mine = list.filter(m => m.mine);
  const counts = { all: onSale.length, mine: mine.length };
  for (const k of ["item", "skill", "game", "ambience", "ability"]) counts[k] = onSale.filter(m => m.kind === k).length;
  const dots = { item: "--tan", skill: "--lav", game: "--rose", ambience: "--sky", ability: "--sage" };
  const tabsHtml = ["all", "item", "skill", "game", "ambience", "ability"].map(k =>
    `<button class="tab${tab === k ? " on" : ""}" data-tab="${k}">${dots[k] ? `<span class="dot" style="background:var(${dots[k]})"></span>` : ""}${esc(t.tabs[k])}<i>${counts[k]}</i></button>`).join("") +
    `<button class="tab shop${tab === "mine" ? " on" : ""}" data-tab="mine">${ICON.shop}${esc(t.tabs.mine)}<i>${counts.mine}</i></button>`;

  let shelf = "";
  const emptyBox = (title, sub) => `<div class="empty"><img src="${ART}item-any.png" alt=""><h3>${esc(title)}</h3><p>${esc(sub)}</p></div>`;
  // (whole rows only: one row of them, two when there are enough to fill two)
  const perRow = Math.max(1, Math.floor(($("shelf").clientWidth + 22) / 258));
  const peopleStrip = (items, t) => { const n = items.length >= perRow * 2 ? perRow * 2 : Math.min(items.length, perRow);
    return items.length ? `<section class="section people"><h2>${esc(t.people)}<small>${esc(t.peopleSub)}</small></h2><div class="grid">${items.slice(0, n).map((m, i) => card(m, t, i, true)).join("")}</div></section>` : ""; };
  const sectionOf = (title, items, sub, cls, showKind) => items.length ? `<section class="section${cls ? " " + cls : ""}"><h2>${esc(title)}<small>${items.length}${sub ? " · " + esc(sub) : ""}</small></h2><div class="grid">${items.map((m, i) => card(m, t, i, showKind)).join("")}</div></section>` : "";
  if (tab === "mine") {
    const selling = mine.filter(m => m.listed && matches(m)).sort(ORDER.new), unsold = mine.filter(m => !m.listed && matches(m));
    shelf = `<div class="mystats">
        <div class="stat"><b>${mine.filter(m => m.listed).length}</b><span>${esc(t.myOnSale)}</span></div>
        <div class="stat"><b>${state.sales || 0}</b><span>${esc(t.mySales)}</span></div>
        <div class="stat star"><b>${starImg()}${state.earned || 0}</b><span>${esc(t.myEarned)}</span></div>
        <label class="drop" id="drop" for="file">${ICON.inbox}<span><b>${esc(t.importB)}</b><span>${esc(t.importSub)}</span></span></label>
      </div>` +
      (selling.length ? `<section class="section"><h2>${esc(t.selling)}<small>${selling.length}</small></h2><div class="rows">${selling.map(m => row(m, t)).join("")}</div></section>` : "") +
      (unsold.length ? `<section class="section"><h2>${esc(t.unsold)}<small>${unsold.length}</small></h2><div class="rows">${unsold.map(m => row(m, t)).join("")}</div></section>` : "") +
      (!selling.length && !unsold.length ? (query ? emptyBox(t.emptySearch, t.emptySearchSub) : emptyBox(t.emptyMine, t.emptyMineSub)) : "");
  } else {
    const kinds = tab === "all" ? ["item", "skill", "game", "ambience", "ability"] : [tab];
    const shown = onSale.filter(matches).sort(ORDER[sort]);
    // what other people made stands in front: this is a marketplace, not a catalogue
    const people = tab === "all" && !seller ? shown.filter(m => !m.official && !m.mine) : [];
    const gone = list.filter(m => !m.listed && !m.mine && m.owned && (tab === "all" || m.kind === tab) && matches(m));
    shelf = (seller ? `<div class="filter">${esc(t.sellerFilter)} <span class="who">${av(seller)}${esc(seller)}<button type="button" data-seller="" aria-label="Clear">${ICON.x}</button></span></div>` : "") +
      peopleStrip(people, t) +
      (seller ? sectionOf(seller, shown.filter(m => kinds.includes(m.kind)), "", "", true) : kinds.map(k => sectionOf(t.tabs[k], shown.filter(m => m.kind === k))).join("")) +
      sectionOf(t.haveGone, gone, "", "", tab === "all");
    if (!shown.length && !gone.length) shelf += emptyBox(t.emptySearch, t.emptySearchSub);
  }
  const sig = tabsHtml + shelf;
  if (sig !== drawn) {
    drawn = sig;
    $("tabs").innerHTML = tabsHtml;
    $("shelf").innerHTML = shelf;
    firstDraw = false;
  }
  renderDrawer();
  renderProfile();

  // who the user is here, and whether the shop can be reached
  const nick = state.nickname || "?";
  const myFace = av(nick, "dot" + (state.online ? "" : " off"));
  if ($("me").dataset.face !== myFace) { $("me").dataset.face = myFace; $("me-av").outerHTML = myFace.replace('class="av', 'id="me-av" class="av'); }
  $("me-nick").textContent = nick;
  $("me").title = t.profile;
  setStars(state.stars);
  const naming = !!state.nicknameGenerated && state.online;
  $("namebanner").hidden = !naming;
  if (naming) { $("name-sub").textContent = t.nameSub(nick); const typed = $("name-in").value.trim(); $("name-av").outerHTML = av(typed || nick).replace('class="av', 'id="name-av" class="av'); }
  $("offline").hidden = hostUp && state.online;

  // the strip: what Nilo last said about the shop, what it is making just now (kind, name, how far), and its offer
  $("who").textContent = state.name || "Nilo";
  // (after something was typed: three dots until Nilo's next line is there - or for as long as it says it is thinking)
  const waitingForAnswer = (typedAt && state.saidAt === typedSaidAt && Date.now() - typedAt < 25000) || state.talk === "thinking";
  if (waitingForAnswer) { if (!$("said").firstElementChild) $("said").innerHTML = `<span class="dots"><i></i><i></i><i></i></span>`; }

/** "I made it - shall I put it up?": drawn once per offer, so that a price being typed is not drawn over by the next poll. */
function renderOffer() {
  const el = $("offer"), o = state && state.offer, t = L();
  const sig = o ? o.seq + "|" + o.id + "|" + (isKo() ? "ko" : "en") : "";
  if (sig === drawnOffer) return;
  drawnOffer = sig;
  el.hidden = !o;
  if (!o) { el.innerHTML = ""; return; }
  const m = (state.list || []).find(x => x.id === o.id) || { id: o.id, kind: o.kind, name: o.name, detail: {} };
  const price = Math.max(0, Math.min(999, parseInt(o.price, 10) || 0));
  el.innerHTML = `${badge(m)}
    <div class="what"><b>${esc(m.name ? nameOf(m) : o.name)}</b><span>${esc(t.offerAsk)}</span></div>
    <div class="acts">
      <div class="stepper"><button type="button" data-offerstep="-5" aria-label="-5">−</button><label>${starImg()}<input type="number" min="0" max="999" value="${price}" id="offerprice" aria-label="${esc(t.cPrice)}"></label><button type="button" data-offerstep="5" aria-label="+5">+</button></div>
      <button class="btn go" type="button" data-offer="yes">${esc(t.offerYes)}</button><button class="btn" type="button" data-offer="no">${esc(t.offerNo)}</button>
    </div>`;
}

function setStars(n) {
  const el = $("starcount");
  if (shownStars === null) { shownStars = n; el.textContent = n; return; }
  if (n === shownStars) return;
  const from = shownStars, t0 = performance.now();
  shownStars = n;
  $("stars").classList.remove("bump"); void $("stars").offsetWidth; $("stars").classList.add("bump");
  // the balance counts down (or up, when something was sold) rather than jumping
  (function step(now) {
    const k = Math.min(1, (now - t0) / 700);
    el.textContent = Math.round(from + (n - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

// ------------------------------------------------------------------ the drawer: one module, with what is inside it
function stepsOf(d, t) {
  const say = st => st.act === "activity" || st.act === "emote" || st.act === "rain" ? st.arg : st.act === "say" ? "“" + st.arg + "”" : st.act === "music" && st.arg === "stop" ? "stop" : st.act === "ambience" && st.arg === "clear" ? "clear" : "";
  return `<div class="steps">` + d.steps.map((st, i) => (i ? `<span class="arrow">›</span>` : "") + `<span class="step">${esc(t.acts[st.act] || st.act)}${say(st) ? ` <b>${esc(say(st))}</b>` : ""}${st.seconds > 0 ? ` <b>${esc(st.seconds)}s</b>` : ""}</span>`).join("") + `</div>`;
}

function moodOf(d) {
  const [c0, c1, c2] = d.colors.map(colour);
  let bits = "";
  for (let i = 0; i < 14; i++) {
    const s = 6 + (i * 37 % 18), x = (i * 61) % 96, y = (i * 43) % 80;
    bits += `<i style="left:${x}%;top:${y}%;width:${s}px;height:${d.pattern === "rain" ? s * 2.4 : s}px;background:${esc(i % 2 ? c1 : c2)};animation-delay:${-(i % 5)}s;${d.pattern === "rain" ? "border-radius:6px;width:3px;" : ""}"></i>`;
  }
  return `<div class="mood" style="background:${esc(c0)}">${d.pattern === "none" ? "" : bits}<span style="position:relative">${esc(d.moodName)}</span></div>`;
}

/** The one thing to do with it, and what stands beside the button. */
function primary(m, t) {
  const wait = waiting.has(m.id) ? " wait" : "";
  const main = (cls, label, attrs) => `<button class="btn main ${cls}${wait}" ${attrs}>${esc(label)}</button>`;
  if (m.id === "game-swarm" && m.installed) return `<a class="btn main go" href="/demon-gate/">${t === T.en ? "Play solo" : "혼자 플레이"}</a>` + main("", t.remove, `data-do="remove" data-id="${esc(m.id)}"`);
  if (m.mine) return priceTag(m, t) + main("", t.manage, `data-tab="mine"`);
  if (m.installed) return priceTag(m, t) + `<span class="note">${esc(t.removeNote)}</span>` + main("", t.remove, `data-do="remove" data-id="${esc(m.id)}"`);
  if (m.owned) return priceTag(m, t) + `<span class="note">${esc(t.ownedNote)}</span>` + main("mint", t.install, `data-do="install" data-id="${esc(m.id)}"`);
  if (!m.listed) return priceTag(m, t) + main("", t.goneBtn, "disabled");
  if (!state.online && !(m.builtin && !m.price)) return priceTag(m, t) + main("", t.offlineBtn, "disabled");
  if (!m.price) return priceTag(m, t) + main("mint", t.get, `data-do="buy" data-id="${esc(m.id)}"`);
  const short = m.price - state.stars;
  if (short > 0) return priceTag(m, t) + main("", t.short(short), "disabled");
  return priceTag(m, t) + main("go", t.buy, `data-confirm="${esc(m.id)}"`);
}

function renderDrawer() {
  const el = $("drawer");
  const m = openId && state ? (state.list || []).find(x => x.id === openId) : null;
  $("scrim").classList.toggle("on", !!m || profileOpen); el.classList.toggle("on", !!m); el.setAttribute("aria-hidden", m ? "false" : "true");
  if (!m) { if (openId) openId = ""; confirmId = ""; return; }
  const t = L(), d = m.detail || {};
  let inside = "";
  if (d.steps && d.steps.length) inside += `<h4>${esc(t.does)}</h4>${stepsOf(d, t)}`;
  if (d.phrases && d.phrases.length) inside += `<h4>${esc(t.say)}</h4>` + d.phrases.slice(0, 5).map(p => `<span class="quote">${esc(p)}</span>`).join("");
  if (m.kind === "game") {
    if (d.howTo) inside += `<h4>${esc(t.how)}</h4><p class="sum">${esc(d.howTo)}</p>`;
    if (m.template === "survival" || m.template === "pop") {
      if (d.seconds) inside += `<div class="facts"><div class="fact"><b>${Math.round(d.seconds)}</b><span>${esc(t.seconds)}</span></div><div class="fact"><b>${esc(d.lives)}</b><span>${esc(t.lives)}</span></div><div class="fact"><b>×${(+d.speed).toFixed(1)}</b><span>${esc(t.pace)}</span></div></div>`;
      if (d.enemyName || d.pickupName) inside += `<div class="cast">` +
        (d.enemyName ? `<div class="k-game">${m.enemyIcon ? `<div class="badge"><div class="face"><img src="${esc(WORLD + m.enemyIcon)}" alt=""></div></div>` : face(glyph(BY_ID[m.id] || "ghost"))}<span><small>${esc(t.enemy)}</small><b>${esc(d.enemyName)}</b></span></div>` : "") +
        (d.pickupName ? `<div class="k-ambience">${m.pickupIcon ? `<div class="badge"><div class="face"><img src="${esc(WORLD + m.pickupIcon)}" alt=""></div></div>` : face(glyph("gem"))}<span><small>${esc(t.pickup)}</small><b>${esc(d.pickupName)}</b></span></div>` : "") + `</div>`;
    }
  }
  if (d.uses && d.uses.length) inside += `<h4>${esc(t.goodFor)}</h4><div class="steps">${d.uses.map(u => `<span class="step">${esc(t.uses[u] || u)}</span>`).join("")}</div>`;
  if (d.examples && d.examples.length) inside += `<h4>${esc(t.tryIt)}</h4>` + d.examples.map(p => `<span class="quote">${esc(p)}</span>`).join("");
  if (d.song) inside += `<h4>${esc(t.tune)}</h4><div class="tune${playing === m.id ? " playing" : ""}"><button class="btn play" data-listen="${esc(m.id)}" aria-label="${esc(playing === m.id ? t.stop : t.listen)}">${playing === m.id
      ? `<svg viewBox="0 0 20 20" fill="${INK}"><rect x="3" y="3" width="5" height="14" rx="1.5"/><rect x="12" y="3" width="5" height="14" rx="1.5"/></svg>` : `<svg viewBox="0 0 20 20" fill="${INK}"><path d="M5 2.8v14.4a1 1 0 0 0 1.5.9l12-7.2a1 1 0 0 0 0-1.8l-12-7.2A1 1 0 0 0 5 2.8z"/></svg>`}</button><span><b>${esc(d.song)}</b><small>${d.bpm ? esc(d.bpm) + " " + esc(t.bpm) : ""}</small></span><span class="eq"><i></i><i></i><i></i><i></i></span></div>`;
  if (d.colors) inside += `<h4>${esc(t.mood)}</h4>${moodOf(d)}`;

  const kindLine = `${esc(m.kind === "game" && t.templates[m.template] ? t.kinds.game + " · " + t.templates[m.template] : t.kinds[m.kind])}${d.version ? " · v" + esc(d.version) : ""}`;
  // the seller: a line of its own, and a way to everything else they sell
  const sellerLine = `<div class="sellerline">${av(sellerOf(m))}
      <button class="who" type="button" ${m.listed ? `data-seller="${esc(sellerOf(m))}"` : "disabled"} title="${esc(t.moreBy)}"><b>${esc(sellerOf(m))}${m.official ? ICON.check : ""}</b><small>${esc(m.official ? t.official : m.mine ? t.yours : t.moreBy)}</small></button>
      <span class="stats"><span>${ICON.got}${esc(t.got(m.installs))}</span><span>${ICON.heart}${m.likes}</span></span>
      ${m.listed && !m.mine ? `<button class="btn like${m.liked ? " on" : ""}" data-do="like" data-id="${esc(m.id)}" aria-label="${esc(t.like)}" aria-pressed="${m.liked}" ${state.online ? "" : "disabled"}>${ICON.heart}</button>` : ""}
    </div>`;
  // before stars are spent: what it costs, who gets them, what is left
  const foot = confirmId === m.id && !m.owned && m.listed
    ? `<div class="sheet"><h3>${esc(t.confirm)}</h3>
        <dl><dt>${esc(t.cPrice)}</dt><dd>${starImg()}${m.price}</dd>
            <dt>${esc(t.cSeller)}</dt><dd>${av(sellerOf(m))}${esc(sellerOf(m))}${m.official ? ICON.check : ""}</dd>
            <dt class="after">${esc(t.cAfter)}</dt><dd class="after">${starImg()}${state.stars - m.price}</dd></dl>
        <div class="acts"><button class="btn" data-confirm="">${esc(t.cancel)}</button><button class="btn go${waiting.has(m.id) ? " wait" : ""}" data-do="buy" data-id="${esc(m.id)}">${esc(t.buyNow)}</button></div></div>`
    : `<div class="dfoot">${primary(m, t)}</div>`;
  const html = `<div class="dtop k-${kindOf(m)}"><button class="btn x" data-close aria-label="Close">${ICON.x}</button>${badge(m)}
      <div><h2>${esc(nameOf(m))}</h2><div class="kindline">${kindLine}</div></div></div>
    ${sellerLine}
    <div class="dbody">
      ${headline(m) ? `<h4 style="margin-top:0">${esc(t.gains)}</h4><p class="gives">${esc(headline(m))}</p><p class="sum">${esc(sumOf(m))}</p>` : `<p class="gives">${esc(sumOf(m))}</p>`}${inside}
    </div>${foot}`;
  if (html !== drawnDrawer) { drawnDrawer = html; el.className = `drawer on k-${kindOf(m)}`; el.innerHTML = html; }
}

// ------------------------------------------------------------------ the profile drawer: the nickname, the hub, what was sold and bought
function renderProfile() {
  const el = $("profile");
  el.classList.toggle("on", profileOpen); el.setAttribute("aria-hidden", profileOpen ? "false" : "true");
  if (!profileOpen || !state) return;
  const t = L(), nick = state.nickname || "?";
  const by = id => (state.list || []).find(x => x.id === id);
  const bought = (state.purchases || []).map(p => { const m = by(p.id) || { id: p.id, kind: p.kind, icon: p.icon, detail: {} };
    return `<div data-open="${esc(p.id)}" class="k-${kindOf(p)}">${badge(m)}<span><b>${esc(m.name ? nameOf(m) : p.name)}</b><small>${esc(p.seller)} · ${new Date(p.at).toLocaleDateString(isKo() ? "ko-KR" : "en-US", { month: "short", day: "numeric" })}</small></span>${p.price ? `<span class="price">${starImg()}${p.price}</span>` : `<span class="price free">${esc(t.free)}</span>`}</div>`; }).join("");
  const sig = JSON.stringify([nick, state.online, state.hub, state.hubLocal, state.stars, state.sales, state.earned, bought, L() === T.ko]);
  if (sig === drawnProfile) return;
  const typed = $("rename-in") ? $("rename-in").value : null;
  drawnProfile = sig;
  el.innerHTML = `<div class="dtop"><button class="btn x" data-close aria-label="Close">${ICON.x}</button>${av(nick)}
      <div><h2>${esc(nick)}</h2><div class="kindline">${esc(t.profile)}</div></div></div>
    <div class="dbody">
      <h4 style="margin-top:0">${esc(t.rename)}</h4>
      <form id="renameform"><input class="field" id="rename-in" maxlength="16" autocomplete="off" spellcheck="false" value="${esc(typed != null ? typed : state.nicknameGenerated ? "" : nick)}" placeholder="${esc(t.namePh)}"><button class="btn sun" type="submit" ${state.online ? "" : "disabled"}>${esc(t.renameGo)}</button></form>
      <p class="hint">${esc(t.renameHint)}</p>
      <h4>${esc(t.hub)}</h4>
      <div class="hubbox"><span class="led${state.online ? "" : " off"}"></span><code>${esc(state.hub || "")}</code><b>${esc(state.online ? t.online : t.offline)}</b></div>
      <p class="hint">${esc(state.hubLocal ? t.hubOwn : t.hubShared)}</p>
      <h4>${esc(t.tabs.mine)}</h4>
      <div class="two"><div class="fact"><b>${state.sales || 0}</b><span>${esc(t.mySales)}</span></div><div class="fact" style="background:#FFF6D6"><b>${state.earned || 0}</b><span>${esc(t.myEarned)}</span></div></div>
      <h4>${esc(t.bought)}</h4>
      ${bought ? `<div class="bought">${bought}</div>` : `<p class="hint">${esc(t.noBought)}</p>`}
    </div>
    <div class="dfoot"><span class="price">${starImg()}${state.stars}</span><span class="note">${esc(t.myStars)}</span><button class="btn main" data-tab="mine">${esc(t.tabs.mine)}</button></div>`;
}

// ------------------------------------------------------------------ talking to the host
async function poll() {
  if (PREVIEW) return;
  try {
    const r = await fetch("/market/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    hostUp = true;
    apply(await r.json());
  } catch (e) { hostUp = false; if (state) { state.online = false; render(); } else { $("offline").hidden = false; $("off-title").textContent = L().hostDown; $("off-sub").textContent = L().hostDownSub; } }
}

/** A new state from the host: what changed is shown as it changes - stars where something was installed, a line for what just happened. */
function apply(next) {
  const before = seen;
  state = next;
  seen = new Set((next.list || []).filter(m => m.installed).map(m => m.id));
  // a button that was pressed waits (with a little spinner) until the host has answered with a new shop
  if (next.revision !== seenRevision) { waiting.clear(); for (const id of Object.keys(drafts)) { const m = next.list.find(x => x.id === id); if (!m || (m.listed && m.price === drafts[id])) delete drafts[id]; } }
  seenRevision = next.revision;
  if (confirmId) { const m = next.list.find(x => x.id === confirmId); if (!m || m.owned) confirmId = ""; }
  if (before) {
    const fresh = [...seen].filter(id => !before.has(id));
    chromeIfLanguageChanged();
    render();
    for (const id of fresh) celebrate(id);
  } else { chrome(); render(); }
  if (next.notice && next.notice !== lastNotice) toast(next.notice);
  lastNotice = next.notice || "";
}
let chromeLang = null;
function chromeIfLanguageChanged() { if (chromeLang !== L()) { chromeLang = L(); chrome(); } }

function send(cmd) {
  if (PREVIEW) { toast(JSON.stringify(cmd)); return Promise.resolve(); }
  return fetch("/market/api/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd) }).then(() => setTimeout(poll, 250), () => { hostUp = false; render(); });
}

/** Something typed to Nilo: it goes into the conversation as if it had been said to it by name (the host: POST /market/api/say). */
function say(text) {
  text = String(text || "").trim();
  if (!text) return;
  typed = text; typedAt = Date.now(); typedSaidAt = state ? state.saidAt : -1;
  render();
  if (PREVIEW) return;
  fetch("/market/api/say", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })
    .then(r => { if (!r.ok) { typedAt = 0; toast(L().talkDown); render(); } else setTimeout(poll, 400); }, () => { typedAt = 0; hostUp = false; render(); });
}

function toast(text) {
  const el = $("toast");
  el.textContent = text; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 3200);
}

/** A confetti of little stars where something has just been bought or installed. */
function celebrate(id) {
  const cardEl = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  const box = (openId === id ? $("drawer").querySelector(".badge") : cardEl || $("stars")).getBoundingClientRect();
  if (cardEl) { cardEl.classList.remove("pop"); void cardEl.offsetWidth; cardEl.classList.add("pop"); }
  const cx = box.left + box.width / 2, cy = box.top + Math.min(box.height / 2, 120);
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("img");
    s.src = ART + "star.png"; s.className = "confetti"; s.alt = "";
    document.body.appendChild(s);
    const a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 150, size = .5 + Math.random() * .9;
    s.animate([
      { transform: `translate(${cx - 11}px, ${cy - 11}px) scale(.2) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${cx - 11 + Math.cos(a) * r}px, ${cy - 11 + Math.sin(a) * r - 40}px) scale(${size}) rotate(${(Math.random() - .5) * 540}deg)`, opacity: 1, offset: .7 },
      { transform: `translate(${cx - 11 + Math.cos(a) * r * 1.1}px, ${cy - 11 + Math.sin(a) * r + 60}px) scale(${size * .8}) rotate(${(Math.random() - .5) * 720}deg)`, opacity: 0 },
    ], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => s.remove();
  }
}

function listen(id) {
  const audio = $("audio");
  if (playing === id) { audio.pause(); playing = ""; }
  else if (!PREVIEW) { audio.src = "/market/song/" + encodeURIComponent(id) + ".wav"; audio.play().catch(() => {}); playing = id; }
  else playing = id;
  drawnDrawer = ""; renderDrawer();
}

/** A .yonder file from a friend: its bytes go to the host, which makes it a thing of the user's own. */
function importFile(file) {
  if (!file) return;
  if (!/\.(yonder|bambi)$/i.test(file.name)) { toast(L().importBad); return; }
  toast(L().importing);
  if (PREVIEW) return;
  fetch("/market/api/import?name=" + encodeURIComponent(file.name), { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file }).then(() => setTimeout(poll, 250), () => { hostUp = false; render(); });
}

// ------------------------------------------------------------------ hands
function priceOf(id) {
  const input = document.querySelector(`input[data-price="${CSS.escape(id)}"]`);
  return Math.max(0, Math.min(999, parseInt(input ? input.value : drafts[id], 10) || 0));
}
/** A price was typed or stepped: remembered until it is saved, and "Save price" shows only when it differs from the one on sale. */
function drafted(id) {
  const m = state && state.list.find(x => x.id === id);
  drafts[id] = priceOf(id);
  const save = document.querySelector(`[data-do="setPrice"][data-id="${CSS.escape(id)}"]`);
  if (save && m) save.hidden = drafts[id] === m.price;
}
document.addEventListener("click", e => {
  const st = e.target.closest("[data-step]");
  if (st) { const input = document.querySelector(`input[data-price="${CSS.escape(st.dataset.id)}"]`); input.value = Math.max(0, Math.min(999, (parseInt(input.value, 10) || 0) + parseInt(st.dataset.step, 10))); drafted(st.dataset.id); return; }
  const b = e.target.closest("[data-do]");
  if (b) {
    e.stopPropagation();
    const id = b.dataset.id, cmd = { cmd: b.dataset.do, id };
    if (cmd.cmd === "publish" || cmd.cmd === "setPrice") { cmd.price = priceOf(id); drafts[id] = cmd.price; }
    if (cmd.cmd !== "like") { waiting.add(id); drawn = ""; drawnDrawer = ""; render(); setTimeout(() => { if (waiting.delete(id)) { drawn = ""; drawnDrawer = ""; render(); } }, 6000); }      // (nothing came back: the button is given back)
    send(cmd);
    return;
  }
  const cf = e.target.closest("[data-confirm]"); if (cf) { confirmId = cf.dataset.confirm; drawnDrawer = ""; renderDrawer(); return; }
  const l = e.target.closest("[data-listen]"); if (l) { listen(l.dataset.listen); return; }
  const sl = e.target.closest("[data-seller]"); if (sl) { seller = sl.dataset.seller; if (seller && tab === "mine") tab = "all"; closeDrawers(); firstDraw = true; render(); if (seller) $("tabs").scrollIntoView({ block: "start" }); return; }
  if (e.target.closest("[data-close]") || e.target === $("scrim")) { closeDrawers(); return; }
  const tb = e.target.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; if (tab === "mine") seller = ""; closeDrawers(); firstDraw = true; render(); return; }
  const so = e.target.closest("[data-sort]"); if (so) { sort = so.dataset.sort; chrome(); firstDraw = true; render(); return; }
  // an example under the box: it fills the box (the user sends it, or changes it first)
  const tr = e.target.closest("[data-try]"); if (tr) { $("talktext").value = tr.dataset.try; $("talktext").focus(); return; }
  // the offer card: a price stepped, and the answer (the same "offer" command the headset's card sends)
  const os = e.target.closest("[data-offerstep]");
  if (os) { const input = $("offerprice"); input.value = Math.max(0, Math.min(999, (parseInt(input.value, 10) || 0) + parseInt(os.dataset.offerstep, 10))); return; }
  const ob = e.target.closest("[data-offer]");
  if (ob && state && state.offer) {
    const yes = ob.dataset.offer === "yes", price = Math.max(0, Math.min(999, parseInt($("offerprice").value, 10) || 0));
    send({ cmd: "offer", id: state.offer.id, text: yes ? (price === 0 ? "yes free" : "yes") : "no", price: yes ? price : 0 });
    $("offer").hidden = true; drawnOffer = "~";       // (drawn again by the next state, should the offer still be open)
    return;
  }
  if (e.target.closest("#me")) { profileOpen = true; openId = ""; drawnProfile = ""; render(); return; }
  const op = e.target.closest("[data-open]"); if (op) { profileOpen = false; openId = op.dataset.open; confirmId = ""; drawnDrawer = ""; render(); return; }
  if (e.target.closest("[data-stop]")) return;       // (the controls of a row are not the row)
  const c = e.target.closest(".card, .row"); if (c) { openId = c.dataset.id; confirmId = ""; drawnDrawer = ""; renderDrawer(); }
});
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.price) drafted(e.target.dataset.price); if (e.target.id === "name-in") render(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawers();
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && (e.target.classList.contains("card") || e.target.classList.contains("row"))) { e.preventDefault(); openId = e.target.dataset.id; drawnDrawer = ""; renderDrawer(); }
});
document.addEventListener("submit", e => {
  const rename = e.target.id === "renameform" ? $("rename-in") : e.target.id === "nameform" ? $("name-in") : null;
  if (!rename) return;
  e.preventDefault();
  const text = rename.value.trim();
  if (text) { send({ cmd: "nickname", text }); rename.value = ""; drawnProfile = ""; }
});
function closeDrawers() { if (playing) { $("audio").pause(); playing = ""; } openId = ""; confirmId = ""; profileOpen = false; renderDrawer(); renderProfile(); }
$("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
$("talk").addEventListener("submit", e => { e.preventDefault(); const box = $("talktext"); say(box.value); box.value = ""; });
// (the tray's "Talk to Nilo ..." opens the page at #talk: the box is ready to type in)
if (location.hash === "#talk") setTimeout(() => { $("talk").scrollIntoView({ block: "center" }); $("talktext").focus(); }, 300);
$("file").addEventListener("change", e => { importFile(e.target.files[0]); e.target.value = ""; });
// a module file can be dropped anywhere on the page; "my shop" shows where
document.addEventListener("dragover", e => { if ([...(e.dataTransfer ? e.dataTransfer.types : [])].includes("Files")) { e.preventDefault(); const d = $("drop"); if (d) d.classList.add("over"); } });
document.addEventListener("dragleave", () => { const d = $("drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); const d = $("drop"); if (d) d.classList.remove("over"); importFile(e.dataTransfer.files[0]); });
$("lang-ko").addEventListener("click", () => setLang("ko"));
$("lang-en").addEventListener("click", () => setLang("en"));
function setLang(l) { lang = l; localStorage.setItem("yonder-market-lang", l); chromeLang = L(); chrome(); drawn = ""; drawnDrawer = ""; drawnProfile = ""; drawnOffer = ""; render(); }
$("audio").addEventListener("error", () => { playing = ""; drawnDrawer = ""; renderDrawer(); });

chromeLang = L(); chrome();
if (PREVIEW) { seen = new Set(state.list.filter(m => m.installed).map(m => m.id)); render(); }
else { poll(); setInterval(poll, 1000); }
</script>
</body>
