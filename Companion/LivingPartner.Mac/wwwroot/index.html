<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yonder · Mac Companion</title><link rel="stylesheet" href="/stage.css">
<script src="/glass-game.js" defer></script><script src="/native-games.js" defer></script><script src="/game-audio.js" defer></script><script src="/stage.js" defer></script></head>
<body>
<main id="scene" aria-label="Yonder TV">
  <div class="shore" aria-hidden="true"></div><div id="portal" hidden></div>
  <img id="bambi" src="/nilo.png" alt="Nilo" hidden>
  <canvas id="glass-game"></canvas>
  <iframe id="gomoku-board" title="Two-player Gomoku" hidden></iframe>
  <section id="native-game" hidden><canvas id="native-floor" aria-hidden="true"></canvas><canvas id="native-court" aria-hidden="true"></canvas><canvas id="native-actors" aria-label="3D arena inside the TV"></canvas>
    <div id="game-hud"><h2 id="game-title"></h2><output id="game-score"></output></div><ol id="swarm-choices" hidden></ol><p id="game-hint" role="status"></p>
  </section>
  <aside id="panel">
    <header><div><h1><img class="wordmark" src="/yonder.png" alt="Yonder"> TV</h1><p id="connection" role="status">Looking for your headset</p></div><button id="fold" aria-label="Collapse settings" hidden>Collapse</button></header>
    <div id="setup">
      <label for="display">TV display</label><select id="display"><option value="mac-tv">The TV showing this browser</option></select>
      <details><summary>Enter screen size</summary><label for="inches">Diagonal (inches)</label><input id="inches" type="number" min="5" max="400" step=".1" placeholder="e.g. 55"></details>
      <button id="fullscreen" class="primary">Use this display</button>
      <p id="placement">Move this window to your TV, then select Use this display.</p>
    </div>
    <div id="pair"><p>Enter this code on your Quest.</p><output id="code" aria-label="Pairing code">······</output></div>
    <a class="solo-launch" href="/demon-gate/">Demon Gate · Play solo</a>
    <div id="controls" hidden>
      <p id="instruction"></p>
      <div class="row"><button data-command="scan">Calibrate TV</button><button id="travel" class="primary"></button></div>
      <div class="row"><select id="games" aria-label="TV games"><option value="game-keeper">Goalkeeper</option><option value="game-tennis">Tennis</option><option value="game-swarm">Demon Gate · Play solo</option><option value="game-gomoku">Two-player Gomoku</option></select><button id="play">Play</button><button data-command="game:stop">Stop game</button></div>
      <img id="demon-cover" src="/art/demon-guard.jpg" alt="Demon Gate" width="84" height="84" hidden>
      <form id="talk"><label for="words">Talk to Nilo</label><div class="row"><input id="words" maxlength="200" placeholder="Hey, Nilo" required><button>Send</button></div></form>
      <label><input type="checkbox" id="speak"> Read Nilo’s replies aloud</label>
    </div>
    <p id="error" aria-live="polite"></p>
  </aside>
  <button id="unfold" hidden>TV settings</button><output id="bubble" hidden></output>
  <aside id="queue" hidden><button id="queue-toggle" aria-expanded="false"></button><section id="jobs" hidden></section></aside>
  <div id="flash" hidden></div>
</main>
</body></html>
