html,body{margin:0;background:transparent;}
body{width:1600px;height:1420px;position:relative;overflow:hidden;font-family:"Jua","Segoe UI",sans-serif;color:#4A2F27;}
.cell{position:absolute;overflow:hidden;}
.pic{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);filter:drop-shadow(0 3px 2px rgba(74,47,39,.28));}
.plain{position:absolute;inset:0;width:100%;height:100%;}
.soft{position:absolute;inset:0;filter:blur(9px);}
.card{position:absolute;left:14px;top:10px;right:14px;bottom:18px;box-sizing:border-box;border-radius:20px;border:5px solid #4A2F27;
  background:linear-gradient(180deg,#FFFCF2 0%,#FFF8EA 55%,#FBEBCB 100%);box-shadow:0 0 0 4px #FFF8EA,0 9px 10px 3px rgba(74,47,39,.26);overflow:hidden;}
.card .band{position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,#FFE9A6,#FFF3CF);border-bottom:3px solid rgba(74,47,39,.35);}
.card .well{position:absolute;left:50%;top:21%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:#FFF8EA;border:4px solid #4A2F27;box-sizing:border-box;}
.shimmer{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 62%,rgba(255,255,255,.9) 80%,rgba(255,255,255,0) 100%);}
.ribbon{position:absolute;left:50px;top:22px;width:360px;height:74px;background:#C9EBB4;border:5px solid #4A2F27;box-sizing:border-box;border-radius:14px;
  box-shadow:0 8px 10px 2px rgba(74,47,39,.24);display:flex;align-items:center;justify-content:center;}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:14px;width:44px;height:60px;background:#8FCF8B;border:5px solid #4A2F27;box-sizing:border-box;z-index:-1;}
.ribbon::before{left:-30px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,34% 50%);border-radius:6px;}
.ribbon::after{right:-30px;clip-path:polygon(0 0,100% 0,66% 50%,100% 100%,0 100%);border-radius:6px;}
.ribbon span{font-size:46px;letter-spacing:.5px;}
